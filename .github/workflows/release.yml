name: Release

# Lint/type/unit tests run locally (scripts/pretest.py) and the same commit must have
# a green CI run. This job verifies the built *artifact* and publishes it.
on:
  push:
    tags:
      # GitHub tag filters use glob syntax, not regex.
      # Extension releases use v*-ext tags and are skipped by the job condition below.
      - 'v*.*.*'

jobs:
  release:
    if: ${{ !endsWith(github.ref_name, '-ext') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: write
      id-token: write  # Required for trusted publishing
      actions: read    # read CI status for the tagged commit

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Require a green CI run for this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        conclusion="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,status --jq '[.[] | select(.status=="completed")][0].conclusion')"
        if [ "$conclusion" != "success" ]; then
          echo "::error::No successful CI run for $GITHUB_SHA (got '${conclusion:-none}'). Push the commit to main and wait for CI, or dispatch CI manually."
          exit 1
        fi

    - uses: astral-sh/setup-uv@v5

    - name: Tag and version agreement
      run: uv run python scripts/check_version_sync.py

    - name: Build package
      working-directory: ./mcp-server
      run: uv build

    - name: Smoke-test the built wheel in an isolated environment
      working-directory: ./mcp-server
      run: uv run --isolated --no-project --with dist/*.whl python tests/check_mcp.py

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: mcp-server/dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: mcp-server/dist/
      # Uses trusted publishing - no API token needed!
      # Configure at: https://pypi.org/manage/project/zotero-keeper/settings/publishing/
