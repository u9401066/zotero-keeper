name: Publish VS Code Extension

# Lint/type/unit/mocha/asset-sync run locally (scripts/pretest.py) and the same
# commit must have a green CI run. This job only does what needs the release tag:
# tag/version agreement, installing the *tag archive*, packaging and publishing.
on:
  push:
    tags:
      # Trigger for extension releases (v0.x.x-ext format)
      - 'v0.*.*-ext'

permissions:
  contents: write  # create the GitHub release
  actions: read    # read CI status for the tagged commit

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true  # Include pubmed-search-mcp submodule

    - name: Require a green CI run for this commit
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        conclusion="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,status --jq '[.[] | select(.status=="completed")][0].conclusion')"
        if [ "$conclusion" != "success" ]; then
          echo "::error::No successful CI run for $GITHUB_SHA (got '${conclusion:-none}'). Push the commit to main and wait for CI, or dispatch CI manually."
          exit 1
        fi

    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - uses: astral-sh/setup-uv@v5

    - name: Tag, version and lockfile agreement
      run: uv run python scripts/check_version_sync.py

    - name: Install dependencies
      working-directory: ./vscode-extension
      run: npm ci

    - name: Audit extension build dependencies
      working-directory: ./vscode-extension
      run: npm audit --audit-level=high

    - name: Managed uv install of the tag archive
      working-directory: ./vscode-extension
      run: uv run python tests/test_uv_managed_install_smoke.py
      env:
        ZOTERO_KEEPER_PACKAGE_SOURCE: "https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz#subdirectory=mcp-server"

    - name: Package extension
      id: package
      working-directory: ./vscode-extension
      shell: bash
      run: |
        version="$(node -p 'require("./package.json").version')"
        filename="vscode-zotero-mcp-${version}.vsix"
        npm run package -- --out "$filename"
        echo "filename=$filename" >> "$GITHUB_OUTPUT"
        echo "repository_path=vscode-extension/$filename" >> "$GITHUB_OUTPUT"

    - name: Inspect VSIX contents
      working-directory: ./vscode-extension
      shell: pwsh
      run: ./scripts/check-vsix-contents.ps1 -VsixPath "${{ steps.package.outputs.filename }}"

    - name: Publish to VS Code Marketplace
      working-directory: ./vscode-extension
      run: npx vsce publish --packagePath "${{ steps.package.outputs.filename }}"
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.package.outputs.repository_path }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
