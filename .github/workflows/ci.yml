name: CI

# Deterministic checks (ruff, mypy, pytest, mocha, guards, asset sync) run locally
# via `python scripts/pretest.py` (pre-push hook). This workflow only covers what a
# developer machine cannot reproduce: a clean checkout with locked dependencies,
# real Linux + Windows runtime behavior, and the packaged VSIX / managed install.
on:
  push:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'docs/**', 'memory-bank/**' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**/*.md', 'docs/**', 'memory-bank/**' ]
  workflow_dispatch:
    inputs:
      macos:
        description: 'Also run the (10x cost) macOS install smoke'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean-install:
    name: Clean install + runtime smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: vscode-extension/package-lock.json

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Locked Keeper environment (fails if uv.lock drifts)
      working-directory: ./mcp-server
      run: uv sync --frozen --group dev

    - name: Stdio + wire smoke tests (real process, loopback fake Zotero)
      working-directory: ./mcp-server
      run: uv run pytest tests/integration -q -n 0

    - name: Cross-version smoke (Python 3.13)
      if: runner.os == 'Linux'
      working-directory: ./mcp-server
      run: uv run --python 3.13 --isolated --group dev pytest tests/integration -q -n 0

    - name: Clean extension install (lockfile)
      working-directory: ./vscode-extension
      run: npm ci

    - name: Audit extension build dependencies
      if: runner.os == 'Linux'
      working-directory: ./vscode-extension
      run: npm audit --audit-level=high

    - name: Package VSIX
      working-directory: ./vscode-extension
      run: npm run package

    - name: Inspect VSIX contents
      working-directory: ./vscode-extension
      shell: pwsh
      run: ./scripts/check-vsix-contents.ps1

    - name: Managed uv install of the pinned packages
      working-directory: ./vscode-extension
      run: uv run python tests/test_uv_managed_install_smoke.py

  macos:
    name: Managed install smoke (macOS, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-14
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: astral-sh/setup-uv@v5
    - name: Managed uv install of the pinned packages
      working-directory: ./vscode-extension
      run: uv run python tests/test_uv_managed_install_smoke.py
